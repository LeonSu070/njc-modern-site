<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>证书查询｜国首检测</title><link rel="stylesheet" href="style.css"></head><body><div id="site-header"></div><main><section class="page-hero"><div class="container"><p class="eyebrow">VERIFICATION CENTER</p><h1>证书查询中心</h1><p class="lead">输入编号，快速核验鉴定证书、标签、检验报告与 PTP 证书。</p></div></section><section class="section"><div class="container query-grid"><div class="panel"><h2>选择查询类型</h2><div class="tabs"><button class="tab active" onclick="selectQuery(this,'鉴定证书')">鉴定证书</button><button class="tab" onclick="selectQuery(this,'标签')">标签查询</button><button class="tab" onclick="selectQuery(this,'检验报告')">检验报告</button><button class="tab" onclick="selectQuery(this,'PTP')">PTP 证书</button></div><label id="query-label">证书号</label><input id="query-input" placeholder="例如：NGC2026018888"><label>校验码（选填）</label><input placeholder="请输入校验码"><button class="btn" onclick="verifyQuery()">立即查询 →</button></div><div class="panel" id="query-result"><p class="muted">查询结果将在这里展示</p><div class="empty">输入编号，开始验证证书信息</div></div></div></section></main><div id="site-footer"></div><script src="app.js"></script></body></html>
